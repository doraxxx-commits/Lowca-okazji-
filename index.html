<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Łowca Okazji</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; margin-bottom: 15px; color: #333; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 Dodaj powiadomienie o okazjonalnej ofercie</h1>
        <form action="/add" method="POST">
            <label for="query">Szukana fraza:</label>
            <input type="text" id="query" name="query" placeholder="np. Jordan 1" required>

            <label for="price">Maksymalna cena (PLN):</label>
            <input type="number" id="price" name="price" placeholder="np. 100" required>

            <button type="submit">Uruchom śledzenie</button>
        </form>
    </div>
</body>
</html>
